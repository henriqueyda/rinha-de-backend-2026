services:
  nginx:
    image: nginx:alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "32MB"

  api1:
    image: henriqueyda/rinha-backend-2026:1
    hostname: api1
    platform: linux/amd64
    ports:
      - "8081:8080"
      - "6061:6060"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"

  api2:
    image: henriqueyda/rinha-backend-2026:1
    hostname: api2
    platform: linux/amd64
    ports:
      - "8082:8080"
      - "6062:6060"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"