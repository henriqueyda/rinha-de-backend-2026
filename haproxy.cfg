global
    maxconn 4096
    nbthread 1

defaults
    option tcpka
    retries 1
    option redispatch 1
    timeout connect 1s
    timeout client 65s
    timeout server 65s
    timeout queue 5s

frontend fraud_front
    bind *:9999
    default_backend fraud_back

backend fraud_back
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    default-server inter 50ms fastinter 10ms rise 2 fall 2
    server api1 /var/run/rinha/api1.sock check maxconn 2048
    server api2 /var/run/rinha/api2.sock check maxconn 2048
